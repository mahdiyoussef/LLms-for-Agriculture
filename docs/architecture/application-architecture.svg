<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Agriculture AI application architecture</title>
  <desc id="desc">Client requests pass through authentication and guardrails to an agent orchestrator. Specialist agriculture agents use deterministic services, scoped memory, RAG retrieval, language models, and approved tools.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#52606d"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#102a43" flood-opacity=".16"/>
    </filter>
    <style>
      .box { stroke-width: 2; rx: 14; filter: url(#shadow); }
      .title { font: 700 25px Arial, sans-serif; fill: #102a43; }
      .label { font: 700 16px Arial, sans-serif; fill: #102a43; }
      .small { font: 14px Arial, sans-serif; fill: #334e68; }
      .tiny { font: 12px Arial, sans-serif; fill: #486581; }
      .edge { stroke: #52606d; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#f5f7fa"/>
  <text x="55" y="58" class="title">Agriculture AI application architecture</text>
  <text x="55" y="86" class="small">Evidence-grounded agents with deterministic agronomic calculations, scoped memory, and human confirmation gates</text>

  <rect x="45" y="125" width="190" height="110" class="box" fill="#d9eaf7" stroke="#2f80ed"/>
  <text x="140" y="165" text-anchor="middle" class="label">Clients</text>
  <text x="140" y="192" text-anchor="middle" class="small">Web, mobile, CLI</text>
  <text x="140" y="214" text-anchor="middle" class="tiny">Farmer or agronomist</text>

  <rect x="285" y="105" width="225" height="150" class="box" fill="#e3fcef" stroke="#27ae60"/>
  <text x="397" y="145" text-anchor="middle" class="label">FastAPI boundary</text>
  <text x="397" y="174" text-anchor="middle" class="small">JWT or OIDC</text>
  <text x="397" y="196" text-anchor="middle" class="small">Validation and rate limits</text>
  <text x="397" y="218" text-anchor="middle" class="small">Prompt guardrails</text>

  <rect x="560" y="105" width="235" height="150" class="box" fill="#fff3d6" stroke="#f2994a"/>
  <text x="677" y="145" text-anchor="middle" class="label">Agent orchestrator</text>
  <text x="677" y="174" text-anchor="middle" class="small">Intent and specialist routing</text>
  <text x="677" y="196" text-anchor="middle" class="small">Evidence aggregation</text>
  <text x="677" y="218" text-anchor="middle" class="small">Confidence and approval gate</text>

  <path d="M235 180 H285" class="edge"/><path d="M510 180 H560" class="edge"/>

  <rect x="835" y="100" width="510" height="190" class="box" fill="#fff" stroke="#829ab1"/>
  <text x="1090" y="135" text-anchor="middle" class="label">Specialist agriculture agents</text>
  <text x="920" y="175" class="small">Crop disease</text><text x="1060" y="175" class="small">Irrigation</text><text x="1190" y="175" class="small">Pest monitoring</text>
  <text x="920" y="205" class="small">Soil health</text><text x="1060" y="205" class="small">Crop planning</text><text x="1190" y="205" class="small">Climate risk</text>
  <text x="920" y="235" class="small">Market intelligence</text><text x="1060" y="235" class="small">Traceability</text><text x="1190" y="235" class="small">Extension</text>
  <text x="1090" y="265" text-anchor="middle" class="small">Farm operations copilot</text>
  <path d="M795 180 H835" class="edge"/>

  <rect x="70" y="365" width="285" height="155" class="box" fill="#e8daef" stroke="#9b51e0"/>
  <text x="212" y="405" text-anchor="middle" class="label">RAG and evidence</text>
  <text x="212" y="435" text-anchor="middle" class="small">Hybrid retrieval</text>
  <text x="212" y="458" text-anchor="middle" class="small">Reranking and graph context</text>
  <text x="212" y="481" text-anchor="middle" class="small">Citations and source scores</text>
  <text x="212" y="503" text-anchor="middle" class="tiny">Agriculture knowledge base</text>

  <rect x="400" y="365" width="285" height="155" class="box" fill="#d9eaf7" stroke="#2f80ed"/>
  <text x="542" y="405" text-anchor="middle" class="label">LLM providers</text>
  <text x="542" y="435" text-anchor="middle" class="small">Amazon Bedrock Converse</text>
  <text x="542" y="458" text-anchor="middle" class="small">Optional local provider</text>
  <text x="542" y="481" text-anchor="middle" class="small">Bedrock Guardrails</text>
  <text x="542" y="503" text-anchor="middle" class="tiny">Explanation, not numeric truth</text>

  <rect x="730" y="365" width="285" height="155" class="box" fill="#e3fcef" stroke="#27ae60"/>
  <text x="872" y="405" text-anchor="middle" class="label">Deterministic services</text>
  <text x="872" y="435" text-anchor="middle" class="small">Irrigation water balance</text>
  <text x="872" y="458" text-anchor="middle" class="small">Nutrient deficit</text>
  <text x="872" y="481" text-anchor="middle" class="small">Revenue and threshold checks</text>
  <text x="872" y="503" text-anchor="middle" class="tiny">Finite-input and safety validation</text>

  <rect x="1060" y="365" width="285" height="155" class="box" fill="#fff3d6" stroke="#f2994a"/>
  <text x="1202" y="405" text-anchor="middle" class="label">Memory and tools</text>
  <text x="1202" y="435" text-anchor="middle" class="small">Farm-scoped SQLite memory</text>
  <text x="1202" y="458" text-anchor="middle" class="small">Weather and web search</text>
  <text x="1202" y="481" text-anchor="middle" class="small">Allowlisted MCP servers</text>
  <text x="1202" y="503" text-anchor="middle" class="tiny">Redaction, retention, deletion</text>

  <path d="M950 290 V330 H212 V365" class="edge"/>
  <path d="M1030 290 V330 H542 V365" class="edge"/>
  <path d="M1110 290 V365" class="edge"/>
  <path d="M1190 290 V330 H1202 V365" class="edge"/>

  <rect x="180" y="625" width="1040" height="105" class="box" fill="#fff" stroke="#627d98"/>
  <text x="700" y="662" text-anchor="middle" class="label">Safety and observability envelope</text>
  <text x="700" y="690" text-anchor="middle" class="small">Evidence validation | calibrated confidence | human approval | audit logging | metrics | regression evaluation</text>
  <text x="700" y="713" text-anchor="middle" class="tiny">No physical, chemical, financial, or record-changing action is performed without explicit authorization</text>
  <path d="M542 520 V625" class="edge"/><path d="M872 520 V625" class="edge"/><path d="M1202 520 V625" class="edge"/>
</svg>
