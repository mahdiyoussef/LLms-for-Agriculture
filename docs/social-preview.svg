<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Agriculture AI RAG platform</title>
  <desc id="desc">A precision agriculture AI platform combining retrieval, specialist agents, language models, memory, and secure AWS deployment.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset=".58" stop-color="#0b3550"/>
      <stop offset="1" stop-color="#0b5b4c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#163d56" stop-opacity=".95"/>
      <stop offset="1" stop-color="#0a293d" stop-opacity=".95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#00131f" flood-opacity=".38"/>
    </filter>
    <style>
      .eyebrow { font: 700 18px Arial, sans-serif; letter-spacing: 3px; fill: #7de2b8; }
      .headline { font: 700 53px Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 22px Arial, sans-serif; fill: #d9f2eb; }
      .label { font: 700 16px Arial, sans-serif; fill: #ffffff; }
      .small { font: 15px Arial, sans-serif; fill: #b7d9d2; }
      .tiny { font: 13px Arial, sans-serif; fill: #8fc0b8; }
      .line { stroke: #7de2b8; stroke-width: 3; fill: none; stroke-linecap: round; }
      .dot { fill: #7de2b8; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1180" cy="65" r="210" fill="#36b37e" opacity=".12"/>
  <circle cx="1050" cy="610" r="270" fill="#2f80ed" opacity=".10"/>
  <path d="M0 540 C180 470 270 585 430 520 S720 450 900 550 S1140 600 1280 500 V640 H0 Z" fill="#063f3b" opacity=".6"/>

  <text x="70" y="82" class="eyebrow">PRECISION AGRICULTURE AI</text>
  <text x="70" y="152" class="headline">Agriculture RAG Platform</text>
  <text x="70" y="194" class="subtitle">Evidence-grounded agents for smarter water, crop, soil, and farm decisions.</text>

  <rect x="70" y="245" width="520" height="250" rx="22" fill="url(#panel)" stroke="#3d7180" stroke-width="2" filter="url(#shadow)"/>
  <text x="104" y="288" class="label">ONE SECURE AI WORKFLOW</text>
  <text x="104" y="328" class="small">RAG retrieval</text>
  <text x="104" y="362" class="small">Specialist agriculture agents</text>
  <text x="104" y="396" class="small">Amazon Bedrock and local LLMs</text>
  <text x="104" y="430" class="small">Farm-scoped persistent memory</text>
  <text x="104" y="464" class="small">Human approval and safety guardrails</text>
  <path d="M330 323 H530 M330 357 H530 M330 391 H530 M330 425 H530 M330 459 H530" class="line" opacity=".42"/>
  <circle cx="330" cy="323" r="5" class="dot"/><circle cx="330" cy="357" r="5" class="dot"/><circle cx="330" cy="391" r="5" class="dot"/><circle cx="330" cy="425" r="5" class="dot"/><circle cx="330" cy="459" r="5" class="dot"/>
  <rect x="505" y="306" width="52" height="174" rx="13" fill="#7de2b8" opacity=".16" stroke="#7de2b8"/>
  <path d="M531 337 C507 365 512 409 531 444 C550 409 555 365 531 337 Z" fill="none" stroke="#7de2b8" stroke-width="4"/>
  <path d="M531 352 V451 M531 386 L515 373 M531 408 L548 393" stroke="#7de2b8" stroke-width="3" fill="none"/>

  <text x="700" y="270" class="label">10 DECISION-SUPPORT AGENTS</text>
  <g filter="url(#shadow)">
    <rect x="700" y="292" width="235" height="68" rx="14" fill="#1c6b62" stroke="#58c8a1"/>
    <rect x="955" y="292" width="235" height="68" rx="14" fill="#1c6b62" stroke="#58c8a1"/>
    <rect x="700" y="378" width="235" height="68" rx="14" fill="#18566b" stroke="#5aa9d6"/>
    <rect x="955" y="378" width="235" height="68" rx="14" fill="#18566b" stroke="#5aa9d6"/>
    <rect x="700" y="464" width="235" height="68" rx="14" fill="#4a536e" stroke="#9bb2e2"/>
    <rect x="955" y="464" width="235" height="68" rx="14" fill="#4a536e" stroke="#9bb2e2"/>
  </g>
  <text x="817" y="333" text-anchor="middle" class="label">Crop disease</text>
  <text x="1072" y="333" text-anchor="middle" class="label">Irrigation</text>
  <text x="817" y="419" text-anchor="middle" class="label">Pest and soil health</text>
  <text x="1072" y="419" text-anchor="middle" class="label">Climate and crop planning</text>
  <text x="817" y="505" text-anchor="middle" class="label">Market intelligence</text>
  <text x="1072" y="505" text-anchor="middle" class="label">Traceability and extension</text>

  <rect x="70" y="565" width="1120" height="2" fill="#7de2b8" opacity=".35"/>
  <text x="70" y="606" class="tiny">FASTAPI  •  RAG  •  AGENTS  •  BEDROCK  •  MEMORY  •  AWS  •  TERRAFORM</text>
  <text x="1195" y="606" text-anchor="end" class="tiny">LLMs-for-Agriculture</text>
</svg>
